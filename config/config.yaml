server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  log_level: "info"
  allow_passthrough_keys: false
  expose_docs: false
  metrics_require_auth: true
  cors_allowed_origins: []

# Browser admin is opt-in. Keep secure cookies enabled outside local development.
admin:
  enabled: false
  session_ttl_seconds: 28800
  secure_cookies: true
  oidc_enabled: false
  bootstrap_emails: []
  allow_master_key_login: true

# Self-service user portal. Key scopes are capped by oidc.default_key_scopes.
portal:
  enabled: true
  session_ttl_seconds: 28800
  secure_cookies: true
  max_active_keys: 10
  max_key_ttl_days: 365

llm:
  default_model: "gpt-4o"
  allowed_models:
    - "gpt-4o"
    - "gpt-4o-mini"
    - "claude-3-5-sonnet-20241022"
    - "claude-3-haiku-20240307"
    - "azure/gpt-4o"
  fallback_models: []
  # fallback_models:
  #   - "claude-3-5-sonnet-20241022"
  #   - "gpt-4o-mini"

  model_aliases:
    gpt-4: "gpt-4o"
    claude-3-sonnet: "claude-3-5-sonnet-20241022"
  per_model_max_tokens:
    gpt-4o: 8192
    gpt-4o-mini: 4096
    claude-3-5-sonnet-20241022: 8192
    claude-3-haiku-20240307: 4096

  # Logical deployment aliases can point to any LiteLLM model/provider.
  # Clients request the alias; Relay verifies the required capabilities.
  deployments: {}
  # deployments:
  #   general:
  #     model: "gpt-4o"
  #     capabilities: [chat, responses, streaming, tools, structured_outputs]
  #     fallback_models: ["claude-3-5-sonnet-20241022"]
  #   vision:
  #     model: "gpt-4o"
  #     capabilities: [chat, responses, streaming, vision]

routing:
  active_policy_version: "default"
  require_declared_capabilities: false
  policies: {}
  # policies:
  #   "2026-07-30":
  #     default_deployment: general
  #     allowed_deployments: [general, vision]
  #     allowed_capabilities: [chat, responses, embeddings, streaming, tools, vision, structured_outputs]
  #     capability_routes:
  #       vision: vision

responses:
  # Provider-side response storage is opt-in for enterprise privacy.
  default_store: false

# MCP is disabled until remote servers and a deny-by-default policy are declared.
# Relay only brokers Streamable HTTP; external servers own tool execution.
mcp:
  enabled: false
  # Public provider-reachable URL for Relay's Streamable HTTP endpoint.
  public_url: ""
  protocol_version: "2025-11-25"
  servers: {}
  active_policy_version: "default"
  policies: {}
  approval_ttl_seconds: 900
  delegated_grant_ttl_seconds: 300
  request_timeout_seconds: 60
  max_result_bytes: 1000000
  allow_insecure_http: false
  allowed_origins: []
  # servers:
  #   code:
  #     url: "https://code-tools.internal/mcp"
  #     transport: streamable_http
  #     description: "External sandbox execution service"
  #     headers_env:
  #       Authorization: CODE_MCP_AUTHORIZATION
  # policies:
  #   "2026-07-30":
  #     default_action: deny
  #     rules:
  #       - name: tests
  #         server: code
  #         tool: "test_*"
  #         action: allow
  #       - name: execution
  #         server: code
  #         tool: execute
  #         action: require_approval
  #         constraints:
  #           allowed_values:
  #             runtime: [python, node]
  #           denied_patterns:
  #             command: ["rm\\s+-rf", "sudo"]
  #         grant:
  #           subject: user
  #           ttl_seconds: 28800
  #           max_calls: 20
  #           constraints:
  #             allowed_values:
  #               runtime: [python]

telemetry:
  enabled: false
  service_name: "geeper-relay"
  otlp_endpoint: ""
  otlp_headers: {}
  sample_ratio: 1.0

oidc:
  issuer_url: ""
  client_id: ""
  client_secret: ""
  scopes: [openid, email, profile]
  subject_claim: sub
  email_claim: email
  name_claim: name
  require_verified_email: true
  allowed_email_domains: []
  default_key_scopes: [chat, responses]
  token_endpoint_auth_method: client_secret_post

rag:
  enabled: true
  top_k: 5
  score_threshold: 0.75
  embedding_model: "all-MiniLM-L6-v2"
  context_prefix: "Relevant internal documentation:\n\n"
  context_separator: "\n\n---\n\n"
  require_acl: true
  hybrid_enabled: true
  candidate_multiplier: 4
  rrf_k: 60
  dense_weight: 1.0
  lexical_weight: 1.0
  # Empty disables cross-encoder reranking. Pin a local path or model revision in production.
  reranker_model: ""
  reranker_top_n: 20
  context_max_tokens: 4000

pii:
  enabled: true
  score_threshold: 0.7
  entities:
    - PERSON
    - EMAIL_ADDRESS
    - PHONE_NUMBER
    - CREDIT_CARD
    - US_SSN
    - IP_ADDRESS
    - LOCATION
    - NRP
    - MEDICAL_LICENSE
    - INTERNAL_SECRET

rate_limiting:
  enabled: true
  backend: "memory"
  redis_url: ""
  defaults:
    requests_per_minute: 60
    tokens_per_minute: 100000
    tokens_per_day: 1000000

content_policy:
  enabled: true
  max_input_tokens: 32000
  blocked_patterns:
    - "ignore previous instructions"
    - "ignore all previous"
    - "you are now dAN"
    - "jailbreak"

cache:
  enabled: false
  type: "local"   # "local" (in-process) | "redis" (shared across workers)
  ttl: 3600       # seconds; exact-match only — same messages → cached response
  redis_host: "localhost"
  redis_port: 6379

analytics:
  enabled: false
  provider: "langfuse"  # only "langfuse" supported; other LiteLLM callbacks can be added

logging:
  level: "info"
  format: "json"
  access_log: true

# Google OAuth portal (optional)
# Enables GET /auth/login → Google consent → GET /auth/callback → issues API key
# Set via env vars or uncomment here:
# google_client_id: ""
# google_client_secret: ""
# auth_base_url: "https://your-proxy.internal"
