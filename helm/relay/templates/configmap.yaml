apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "relay.fullname" . }}-config
  labels:
    {{- include "relay.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8000
      workers: {{ .Values.config.workers }}
      log_level: {{ .Values.config.logLevel | default "info" | quote }}
      allow_passthrough_keys: {{ .Values.config.allowPassthroughKeys }}
      expose_docs: {{ .Values.config.exposeDocs }}
      metrics_require_auth: {{ .Values.config.metricsRequireAuth }}
      cors_allowed_origins: {{ toJson .Values.config.corsAllowedOrigins }}

    admin:
      enabled: {{ .Values.config.admin.enabled }}
      session_ttl_seconds: {{ .Values.config.admin.sessionTtlSeconds }}
      secure_cookies: {{ .Values.config.admin.secureCookies }}
      oidc_enabled: {{ .Values.config.admin.oidcEnabled }}
      bootstrap_emails: {{ toJson .Values.config.admin.bootstrapEmails }}
      allow_master_key_login: {{ .Values.config.admin.allowMasterKeyLogin }}

    portal:
      enabled: {{ .Values.config.portal.enabled }}
      session_ttl_seconds: {{ .Values.config.portal.sessionTtlSeconds }}
      secure_cookies: {{ .Values.config.portal.secureCookies }}
      max_active_keys: {{ .Values.config.portal.maxActiveKeys }}
      max_key_ttl_days: {{ .Values.config.portal.maxKeyTtlDays }}

    llm:
      default_model: {{ .Values.config.llm.defaultModel | quote }}
      allowed_models:
        {{- if .Values.config.llm.allowedModels }}
        {{- range .Values.config.llm.allowedModels }}
        - {{ . | quote }}
        {{- end }}
        {{- else }} []
        {{- end }}
      fallback_models:
        {{- if .Values.config.llm.fallbackModels }}
        {{- range .Values.config.llm.fallbackModels }}
        - {{ . | quote }}
        {{- end }}
        {{- else }} []
        {{- end }}
      model_aliases:
        {{- if .Values.config.llm.modelAliases }}
        {{- range $k, $v := .Values.config.llm.modelAliases }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- else }} {}
        {{- end }}
      per_model_max_tokens:
        {{- if .Values.config.llm.perModelMaxTokens }}
        {{- range $k, $v := .Values.config.llm.perModelMaxTokens }}
        {{ $k }}: {{ $v }}
        {{- end }}
        {{- else }} {}
        {{- end }}
      deployments:
        {{- toYaml .Values.config.llm.deployments | nindent 8 }}

    routing:
      active_policy_version: {{ .Values.config.routing.activePolicyVersion | quote }}
      require_declared_capabilities: {{ .Values.config.routing.requireDeclaredCapabilities }}
      policies:
        {{- toYaml .Values.config.routing.policies | nindent 8 }}

    responses:
      default_store: {{ .Values.config.responses.defaultStore }}

    mcp:
      enabled: {{ .Values.config.mcp.enabled }}
      public_url: {{ .Values.config.mcp.publicUrl | quote }}
      protocol_version: {{ .Values.config.mcp.protocolVersion | quote }}
      servers:
        {{- toYaml .Values.config.mcp.servers | nindent 8 }}
      active_policy_version: {{ .Values.config.mcp.activePolicyVersion | quote }}
      policies:
        {{- toYaml .Values.config.mcp.policies | nindent 8 }}
      approval_ttl_seconds: {{ .Values.config.mcp.approvalTtlSeconds }}
      delegated_grant_ttl_seconds: {{ .Values.config.mcp.delegatedGrantTtlSeconds }}
      request_timeout_seconds: {{ .Values.config.mcp.requestTimeoutSeconds }}
      max_result_bytes: {{ .Values.config.mcp.maxResultBytes }}
      allow_insecure_http: {{ .Values.config.mcp.allowInsecureHttp }}
      allowed_origins: {{ toJson .Values.config.mcp.allowedOrigins }}

    telemetry:
      enabled: {{ .Values.config.telemetry.enabled }}
      service_name: {{ .Values.config.telemetry.serviceName | quote }}
      otlp_endpoint: {{ .Values.config.telemetry.otlpEndpoint | quote }}
      otlp_headers: {{ toJson .Values.config.telemetry.otlpHeaders }}
      sample_ratio: {{ .Values.config.telemetry.sampleRatio }}

    oidc:
      scopes: {{ toJson .Values.config.oidc.scopes }}
      subject_claim: {{ .Values.config.oidc.subjectClaim | quote }}
      email_claim: {{ .Values.config.oidc.emailClaim | quote }}
      name_claim: {{ .Values.config.oidc.nameClaim | quote }}
      require_verified_email: {{ .Values.config.oidc.requireVerifiedEmail }}
      allowed_email_domains: {{ toJson .Values.config.oidc.allowedEmailDomains }}
      default_key_scopes: {{ toJson .Values.config.oidc.defaultKeyScopes }}
      token_endpoint_auth_method: {{ .Values.config.oidc.tokenEndpointAuthMethod | quote }}

    rag:
      enabled: {{ .Values.config.rag.enabled }}
      top_k: {{ .Values.config.rag.topK }}
      score_threshold: {{ .Values.config.rag.scoreThreshold }}
      embedding_model: {{ .Values.config.rag.embeddingModel | default "all-MiniLM-L6-v2" | quote }}
      context_prefix: "Relevant internal documentation:\n\n"
      context_separator: "\n\n---\n\n"
      require_acl: {{ .Values.config.rag.requireAcl }}
      hybrid_enabled: {{ .Values.config.rag.hybridEnabled }}
      candidate_multiplier: {{ .Values.config.rag.candidateMultiplier }}
      rrf_k: {{ .Values.config.rag.rrfK }}
      dense_weight: {{ .Values.config.rag.denseWeight }}
      lexical_weight: {{ .Values.config.rag.lexicalWeight }}
      reranker_model: {{ .Values.config.rag.rerankerModel | quote }}
      reranker_top_n: {{ .Values.config.rag.rerankerTopN }}
      context_max_tokens: {{ .Values.config.rag.contextMaxTokens }}

    pii:
      enabled: {{ .Values.config.pii.enabled }}
      score_threshold: {{ .Values.config.pii.scoreThreshold }}
      entities:
        {{- if .Values.config.pii.entities }}
        {{- range .Values.config.pii.entities }}
        - {{ . }}
        {{- end }}
        {{- else }} []
        {{- end }}
      allow_list: {{ toJson .Values.config.pii.allowList }}

    rate_limiting:
      enabled: {{ .Values.config.rateLimiting.enabled }}
      {{- if .Values.redis.enabled }}
      backend: "redis"
      {{- else }}
      backend: {{ .Values.config.rateLimiting.backend | quote }}
      {{- end }}
      redis_url: ""
      defaults:
        requests_per_minute: {{ .Values.config.rateLimiting.defaults.requestsPerMinute | int }}
        tokens_per_minute: {{ .Values.config.rateLimiting.defaults.tokensPerMinute | int }}
        tokens_per_day: {{ .Values.config.rateLimiting.defaults.tokensPerDay | int }}

    content_policy:
      enabled: {{ .Values.config.contentPolicy.enabled }}
      max_input_tokens: {{ .Values.config.contentPolicy.maxInputTokens }}
      blocked_patterns:
        {{- if .Values.config.contentPolicy.blockedPatterns }}
        {{- range .Values.config.contentPolicy.blockedPatterns }}
        - {{ . | quote }}
        {{- end }}
        {{- else }} []
        {{- end }}

    cache:
      enabled: {{ .Values.config.cache.enabled }}
      {{- if .Values.redis.enabled }}
      type: "redis"
      {{- else }}
      type: {{ .Values.config.cache.type | quote }}
      {{- end }}
      ttl: {{ .Values.config.cache.ttl }}
      {{- if .Values.redis.enabled }}
      redis_host: {{ include "relay.redisHost" . | quote }}
      redis_port: 6379
      {{- else }}
      redis_host: "localhost"
      redis_port: 6379
      {{- end }}

    analytics:
      enabled: {{ .Values.config.analytics.enabled }}
      provider: {{ .Values.config.analytics.provider | quote }}

    code_review:
      sync_on_startup: {{ .Values.config.codeReview.syncOnStartup }}
      github:
        include: {{ toJson .Values.config.codeReview.github.include }}
        orgs: {{ toJson .Values.config.codeReview.github.orgs }}
        exclude: {{ toJson .Values.config.codeReview.github.exclude }}
        ref: {{ .Values.config.codeReview.github.ref | quote }}
      gitlab:
        host: {{ .Values.config.codeReview.gitlab.host | quote }}
        include: {{ toJson .Values.config.codeReview.gitlab.include }}
        groups: {{ toJson .Values.config.codeReview.gitlab.groups }}
        exclude: {{ toJson .Values.config.codeReview.gitlab.exclude }}
        ref: {{ .Values.config.codeReview.gitlab.ref | quote }}
